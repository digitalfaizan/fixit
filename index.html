<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TechFix Solutions | Computer Parts, PC Repair &amp; CCTV Store</title>
<meta name="description" content="Computer components, PC and laptop repair, and CCTV solutions. Enquire on WhatsApp.">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf7;--pn:#ffffff;--pn2:#f1ede4;--gd:#b08840;--gd2:#c49c52;--gt:#8a6a24;--tx:#14161a;--mu:#5d636e;--ln:#e6e1d6;--wa:#25d366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:130px}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.6 Manrope,system-ui,sans-serif}
a{color:inherit;text-decoration:none}img,svg{max-width:100%}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px}
h1,h2,h3{margin:0 0 .4em;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(2.3rem,5.4vw,4.2rem);font-weight:800}
h2{font-size:clamp(1.4rem,2.6vw,2rem);font-weight:800}
h3{font-size:1rem;font-weight:700}
p{margin:0 0 1em;color:var(--mu)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ln);background:var(--pn2);color:var(--tx);padding:11px 18px;border-radius:10px;font:700 .88rem Manrope,sans-serif;cursor:pointer;transition:transform .2s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--gd)}
.btn.g{background:var(--gd);border-color:var(--gd);color:#15130d}.btn.g:hover{background:var(--gd2)}
.btn.w{background:var(--wa);border-color:var(--wa);color:#04210f}.btn.w:hover{background:#3be37c}
.btn.s{padding:9px 12px;font-size:.8rem}
.ann{background:var(--gd);color:#15130d;text-align:center;font-weight:700;font-size:.82rem;padding:7px 12px}
header{position:sticky;top:0;z-index:50;background:rgba(251,250,247,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
.hd{display:flex;align-items:center;gap:16px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;white-space:nowrap}
.logo i{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--gd);color:var(--gd);display:grid;place-items:center}
.logo small{display:block;color:var(--gd);font-size:.62rem;font-weight:700;letter-spacing:.14em;line-height:1}
.sb{flex:1;display:flex;max-width:640px;margin:0 auto}
.sb input{flex:1;min-width:0;background:var(--pn);border:1px solid var(--ln);border-right:0;color:var(--tx);border-radius:10px 0 0 10px;padding:11px 14px;font:inherit}
.sb button{background:var(--gd);border:0;border-radius:0 10px 10px 0;width:50px;color:#15130d;cursor:pointer;display:grid;place-items:center}
.burger{display:none;background:none;border:1px solid var(--ln);color:var(--tx);border-radius:10px;width:42px;height:42px;font-size:1.2rem;cursor:pointer}
.cn{border-top:1px solid var(--ln);background:var(--bg)}
.cn ul{list-style:none;margin:0 auto;padding:0 18px;max-width:1240px;display:flex;gap:2px}
.cn li{position:relative}
.cn li>a{display:block;padding:12px 13px;font-weight:600;font-size:.86rem;color:var(--mu);white-space:nowrap;transition:color .2s}
.cn li:hover>a,.cn li:focus-within>a{color:var(--gd)}
.dd{display:none;position:absolute;left:0;top:100%;min-width:230px;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:8px;box-shadow:0 18px 40px rgba(20,22,26,.14)}
.cn li:hover .dd,.cn li:focus-within .dd{display:block}
.dd a{display:block;padding:9px 12px;border-radius:8px;color:var(--tx);font-size:.88rem}.dd a:hover{background:var(--pn2);color:var(--gd)}
.hero{position:relative;overflow:hidden;background:radial-gradient(700px 380px at 82% 30%,rgba(176,136,64,.16),transparent),linear-gradient(180deg,#fff,var(--bg))}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;padding-top:56px;padding-bottom:64px}
.hero p{font-size:1.1rem;max-width:480px}
.hero h1 span{color:var(--gd)}
.in{animation:up .8s both}.in2{animation:up .8s .15s both}.in3{animation:up .8s .3s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.stage{position:relative;aspect-ratio:5/4;background:linear-gradient(150deg,var(--pn2),var(--pn));border:1px solid var(--ln);border-radius:22px;display:grid;place-items:center;color:var(--gd);overflow:hidden}
.stage svg{width:58%;height:auto;opacity:.95}
.art{position:relative;overflow:hidden;aspect-ratio:4/3;background:linear-gradient(145deg,var(--pn2),#e9e3d4);display:grid;place-items:center;color:var(--gd)}
.art svg{width:38%;height:auto}
.art img,.stage>img{position:absolute;inset:0;width:100%!important;height:100%;object-fit:cover}
sec{display:block}
section{padding:54px 0}
.sh{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:20px}.sh a{color:var(--gd);font-weight:700;font-size:.88rem;white-space:nowrap}
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin}
.cat{flex:0 0 190px;scroll-snap-align:start;border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--pn);transition:transform .25s,border-color .25s}
.cat:hover{transform:translateY(-4px);border-color:var(--gd)}.cat h3{padding:12px 14px;margin:0;font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pc{display:flex;flex-direction:column;background:var(--pn);border:1px solid var(--ln);border-radius:14px;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}
.pc:hover{transform:translateY(-4px);border-color:var(--gd);box-shadow:0 14px 30px rgba(20,22,26,.12)}
.pb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}.pb h3{margin:0;font-size:.95rem}.pb h3 a:hover{color:var(--gd)}
.sp{font-size:.8rem;color:var(--mu)}.pr{color:var(--gd);font-weight:800}
.tag{position:absolute;top:10px;left:10px;z-index:2;background:var(--gd);color:#15130d;font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:99px}
.acts{display:grid;gap:8px;margin-top:auto;padding-top:8px}
.row .pc{flex:0 0 240px;scroll-snap-align:start}
.cc{border:1px solid var(--gd);border-radius:22px;background:linear-gradient(135deg,#fff,#f6f1e4);padding:34px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.f{display:grid;gap:11px}.f label{font-weight:600;font-size:.85rem;display:grid;gap:5px}
.f input,.f select,.f textarea,.tb select{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:11px 12px;font:inherit;width:100%}
.err{color:#ff9a9a;font-size:.78rem;min-height:1em}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:18px}.box h3{margin-top:10px}.box p{margin:0;font-size:.88rem}
.ico{color:var(--gd)}
.note{border-left:3px solid var(--gd);background:rgba(176,136,64,.09);padding:9px 13px;border-radius:0 8px 8px 0;font-size:.85rem;color:var(--mu);margin-bottom:14px}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.tb select{width:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.chip{flex:none;border:1px solid var(--ln);background:var(--pn);color:var(--mu);padding:8px 14px;border-radius:99px;font:600 .82rem Manrope,sans-serif;cursor:pointer}.chip.on{background:var(--gd);border-color:var(--gd);color:#15130d}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:34px;padding:34px 0}.pd .art{border-radius:18px;border:1px solid var(--ln);aspect-ratio:1}.pd .art svg{width:36%}
.crumb{font-size:.82rem;color:var(--mu);padding-top:20px}.crumb a{color:var(--gd)}
footer{background:#f1ede4;border-top:1px solid var(--ln);padding:44px 0 90px;margin-top:30px}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:28px;font-size:.88rem}.fg h3{color:var(--gd);margin-bottom:12px}.fg a{display:block;color:var(--mu);padding:3px 0}.fg a:hover{color:var(--gd)}.fg p{margin:0 0 6px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;width:56px;height:56px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 8px 24px rgba(20,22,26,.25);transition:transform .2s}.fab:hover{transform:scale(1.08)}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(3,1fr)}.hero .wrap,.cc,.pd{grid-template-columns:1fr}.fg{grid-template-columns:1fr 1fr}}
@media(max-width:860px){.burger{display:block}.cn{display:none}.cn.open{display:block;max-height:70vh;overflow:auto}.cn ul{flex-direction:column;padding:8px 18px}.dd{display:block;position:static;border:0;box-shadow:none;background:none;padding:0 0 6px 12px}.dd a{color:var(--mu)}.logo small{display:none}.hd{gap:10px}.hd>.btn{display:none}}
@media(max-width:640px){section{padding:38px 0}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.g3{grid-template-columns:1fr}.g5{grid-template-columns:repeat(2,1fr)}.cc{padding:20px}.cat{flex-basis:150px}.row .pc{flex-basis:190px}.pb{padding:11px}.fg{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
.pr,.sh a,.crumb a,.fg h3,.hero h1 span,.dd a:hover,.cn li:hover>a,.cn li:focus-within>a{color:var(--gt)}.btn.g,.ann,.tag{color:#fff}.btn.g{background:var(--gt);border-color:var(--gt)}.btn.g:hover{background:var(--gd)}.ann{background:#14161a;color:#f5f5f2}.tag{background:#14161a}.pc,.box,.cat{box-shadow:0 1px 2px rgba(20,22,26,.04)}.art{color:var(--gt)}.stage{color:var(--gt)}.logo i{color:var(--gt);border-color:var(--gt)}.sb button{color:#fff;background:#14161a}.chip.on{background:#14161a;border-color:#14161a;color:#fff}.f input:focus,.f select:focus,.f textarea:focus,.sb input:focus{border-color:var(--gd);outline:none}html,body{overflow-x:hidden}.btn{min-height:42px}.sh{flex-wrap:wrap}.pb h3{overflow-wrap:anywhere}
@media(max-width:860px){.sb{max-width:none}.hero .wrap{padding-top:34px;padding-bottom:40px}.stage{aspect-ratio:16/10}.stage svg{width:30%}.pd{gap:20px;padding:20px 0}.pd h1{font-size:1.6rem!important}}
@media(max-width:640px){.hd{height:60px}.hero .btn{flex:1 1 140px}.cc{gap:20px}.chips{margin-right:-18px;padding-right:18px}.acts .btn{padding:10px 8px}.fab{width:52px;height:52px}}
@media(max-width:420px){.logo>span{display:none}.wrap{padding:0 14px}.sb input{padding:10px}h1{font-size:2.1rem}}
</style>
</head>
<body>
<div class="ann" id="ann"></div>
<header>
<div class="wrap hd">
<button class="burger" id="bg" aria-label="Menu" aria-expanded="false">&#9776;</button>
<a class="logo" href="#/"><i id="lg"></i><span><span data-b></span><small>COMPUTERS &middot; CCTV</small></span></a>
<form class="sb" id="sf" role="search"><input id="sq" type="search" placeholder="Search RAM, SSD, CCTV..." aria-label="Search products"><button aria-label="Search" id="sbtn"></button></form>
<a class="btn w" data-wa="Hi, I would like to know more about your products and services." href="#" id="hwa">WhatsApp</a>
</div>
<nav class="cn" id="cn" aria-label="Categories"><ul id="nav"></ul></nav>
</header>
<main id="app"></main>
<footer><div class="wrap fg" id="ft"></div></footer>
<a class="fab" data-wa="Hi, I would like to know more about your products and services." href="#" aria-label="Chat on WhatsApp" id="fab"></a>

<script>
/* ===== EDIT HERE: demo business data ===== */
const CONFIG={
 brand:"TechFix",
 whatsapp:"919999999999", // international format, no + or spaces
 announce:"Announcement bar: edit this text for offers or service notices.",
 phone:"+91 99999 99999 (placeholder)",address:"Shop No. 00, Sample Market, Your City (placeholder)",
 hours:"Mon-Sat 10:00 AM - 8:00 PM (placeholder)",email:"hello@example.com (placeholder)",
 // Paste image URLs (work when this file is hosted on your own site). Keys: hero, repair, cctv, or a category slug. Empty shows an icon.
 img:{hero:"",repair:"",cctv:"",ram:"",ssd:"",gpu:"",cpu:"",board:"",psu:"",case:"",periph:"",monitor:"",net:"",laptop:"",cam:"",nvr:"",sec:""}
};
const CATS=[["ram","RAM","ram"],["ssd","SSDs & Hard Drives","ssd"],["gpu","Graphics Cards","gpu"],["cpu","Processors","cpu"],["board","Motherboards","board"],["psu","Power Supplies","psu"],["case","Cabinets","case"],["periph","Keyboards, Mice & Peripherals","kb"],["monitor","Monitors","monitor"],["net","Networking","net"],["laptop","Laptops & Computers","laptop"],["cam","CCTV Cameras","cctv"],["nvr","DVR / NVR Systems","nvr"],["sec","Security Accessories","lock"]];
const NAV=[["PC Components","board,cpu,psu,case"],["RAM & Storage","ram,ssd"],["Graphics Cards","gpu"],["Processors & Motherboards","cpu,board"],["PC Accessories","periph,monitor,net"],["Laptops & Computers","laptop"],["CCTV & Security","cam,nvr,sec"],["PC Repair Services","","#/?s=repair"]];
// [category, name, optional image URL]. Specs/prices intentionally blank: shown as "on request".
const PRODUCTS=[
["ram","DDR4 Desktop RAM"],["ram","DDR5 Desktop RAM"],["ram","Laptop RAM (SO-DIMM)"],
["ssd","SATA SSD"],["ssd","NVMe M.2 SSD"],["ssd","Internal Hard Drive"],
["gpu","Gaming Graphics Card"],["gpu","Entry Graphics Card"],["gpu","Workstation Graphics Card"],
["cpu","Desktop Processor"],["cpu","Gaming Processor"],["cpu","Budget Processor"],
["board","Intel Motherboard"],["board","AMD Motherboard"],["board","Micro-ATX Motherboard"],
["psu","Standard Power Supply"],["psu","Modular Power Supply"],["psu","Gaming Power Supply"],
["case","Mid-Tower Cabinet"],["case","Gaming Cabinet"],["case","Compact Cabinet"],
["periph","Wireless Keyboard & Mouse"],["periph","Gaming Mouse"],["periph","Mechanical Keyboard"],
["monitor","Office Monitor"],["monitor","Gaming Monitor"],
["net","Wi-Fi Router"],["net","Network Cables & Adapters"],
["laptop","Office Laptop"],["laptop","Assembled Desktop PC"],
["cam","Dome CCTV Camera"],["cam","Bullet CCTV Camera"],["cam","Wi-Fi Security Camera"],
["nvr","DVR Recorder"],["nvr","NVR Recorder"],
["sec","CCTV Cables & Connectors"],["sec","Surveillance Hard Drive"]
].map((p,i)=>({id:i,cat:p[0],name:p[1],img:p[2]||"",tag:[0,6,9,13,24,30,33].includes(i)?"Featured":[4,7,14,28,31].includes(i)?"New":""}));
const SERVICES=[["Hardware Repairs","Diagnosis and replacement of faulty components.","repair"],["Laptop Repairs","Screens, keyboards, batteries and more.","laptop"],["Upgrades","RAM, storage and other performance upgrades.","ram"],["Diagnostics","Find out what is wrong before you spend.","tools"],["Software Troubleshooting","Windows installation, errors and slowdowns.","check"]];
const WHY=[["Easy WhatsApp enquiries","Message us about any product or service.","wa"],["Parts and repairs together","Buy components and get them fitted in one place.","ram"],["CCTV supply and installation","Systems matched to your property.","cctv"],["Hardware and software help","Support for physical faults and software issues.","tools"],["Personal assistance","Talk to us directly about what you need.","check"]];

const P={
cpu:'<rect x="7" y="7" width="10" height="10" rx="2"/><path d="M9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4"/>',
ram:'<rect x="2" y="8" width="20" height="8" rx="1"/><path d="M6 16v2M10 16v2M14 16v2M18 16v2M6 11h2M11 11h2M16 11h2"/>',
ssd:'<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="12" r="3"/><path d="M15 9h2M15 12h2"/>',
gpu:'<rect x="2" y="7" width="20" height="9" rx="2"/><circle cx="9" cy="11.5" r="2.5"/><circle cx="16" cy="11.5" r="2.5"/><path d="M5 16v3"/>',
board:'<rect x="3" y="3" width="18" height="18" rx="2"/><rect x="8" y="8" width="5" height="5"/><path d="M16 7v6M7 17h10"/>',
case:'<rect x="6" y="2" width="12" height="20" rx="2"/><circle cx="12" cy="9" r="3"/><path d="M9 17h6"/>',
psu:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M13 8l-3 4h4l-3 4"/>',
kb:'<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
monitor:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
net:'<path d="M5 12a10 10 0 0114 0M8 15a6 6 0 018 0"/><circle cx="12" cy="18" r="1.5"/>',
laptop:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
cctv:'<path d="M3 8l13-3 2 5-13 3z"/><path d="M18 10l3 1M8 13l-1 4M5 20h6"/>',
nvr:'<rect x="2" y="8" width="20" height="8" rx="2"/><circle cx="7" cy="12" r="1"/><path d="M12 12h7"/>',
lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
repair:'<path d="M14 6a4 4 0 005 5l-9 9a2.5 2.5 0 01-4-4l9-9"/>',
tools:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
check:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
wa:'<path fill="#04210f" stroke="none" d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm5.2 13.9c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.2.5.2.5.4.1.2.1.8-.1 1.4z"/>'};
const ic=(k,s=28)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;
const pic=u=>u?`<img src="${u}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const wa=t=>`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(t)}`;
const go=t=>window.open(wa(t),'_blank','noopener');
const buy=n=>`Hi, I am interested in purchasing ${n}. Please share the price, availability, and details.`;
const cat=k=>CATS.find(c=>c[0]===k);
const art=(p,s)=>`<div class="art">${p.tag?`<span class="tag">${p.tag}</span>`:''}${ic(cat(p.cat)[2])}${pic(p.img||CONFIG.img[p.cat])}</div>`;
const card=p=>`<article class="pc">${`<a href="#/product/${p.id}" aria-label="${esc(p.name)}">${art(p)}</a>`}<div class="pb"><h3><a href="#/product/${p.id}">${p.name}</a></h3><div class="sp">${cat(p.cat)[1]} &middot; Specs on request</div><div class="pr">Price on Request</div><div class="acts"><a class="btn s" href="#/product/${p.id}">View Details</a><a class="btn w s" href="${wa(buy(p.name))}" target="_blank" rel="noopener">Enquire on WhatsApp</a></div></div></article>`;

/* static chrome */
document.querySelectorAll('[data-b]').forEach(e=>e.textContent=CONFIG.brand);
$('#ann').textContent=CONFIG.announce;
$('#lg').innerHTML=ic('cpu',20);$('#sbtn').innerHTML=ic('search',20);$('#fab').innerHTML=ic('wa',30);
$('#nav').innerHTML=NAV.map(n=>{const href=n[2]||`#/shop?c=${n[1]}`;const dd=n[1]?`<div class="dd">${n[1].split(',').map(k=>`<a href="#/shop?c=${k}">${cat(k)[1]}</a>`).join('')}</div>`:'';return `<li><a href="${href}">${n[0]}</a>${dd}</li>`}).join('');
$('#ft').innerHTML=`<div><div class="logo" style="margin-bottom:12px"><span>${CONFIG.brand}</span></div><p>Computer components, repair services and CCTV solutions. Demo content with placeholder details.</p></div>
<div><h3>Shop</h3>${CATS.slice(0,7).map(c=>`<a href="#/shop?c=${c[0]}">${c[1]}</a>`).join('')}<a href="#/shop">All products</a></div>
<div><h3>Services</h3><a href="#/?s=repair">PC Repair Services</a><a href="#/?s=cctv">CCTV Installation</a><a href="#/shop?c=cam,nvr,sec">CCTV Products</a><a href="#/shop?c=laptop">Laptops &amp; Computers</a></div>
<div><h3>Contact</h3><p>${esc(CONFIG.phone)}</p><p>${esc(CONFIG.address)}</p><p>${esc(CONFIG.hours)}</p><p>${esc(CONFIG.email)}</p><a href="#" data-wa="Hi, I need some help. Please assist me." style="color:var(--wa);font-weight:700">Chat on WhatsApp</a></div>`;

/* views */
const rowOf=k=>{const l=PRODUCTS.filter(p=>p.cat===k);return `<section style="padding:26px 0"><div class="wrap"><div class="sh"><h2 style="font-size:1.3rem;margin:0">${cat(k)[1]}</h2><a href="#/shop?c=${k}">View all</a></div><div class="car row">${l.map(card).join('')}</div></div></section>`};
function home(){
return `<div class="hero"><div class="wrap"><div><h1 class="in">Upgrade Your Setup. <span>Protect Your Space.</span></h1><p class="in2">Computer components, expert repair services, and CCTV solutions in one place.</p><div class="in3" style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn g" href="#/shop">Explore Products</a><a class="btn" href="#/?s=repair">Book a Repair</a></div></div><div class="stage in2">${ic('board',200)}${pic(CONFIG.img.hero)}</div></div></div>
<section><div class="wrap"><div class="sh"><h2>Shop by category</h2><a href="#/shop">All products</a></div><div class="car">${CATS.map(c=>`<a class="cat" href="#/shop?c=${c[0]}"><div class="art">${ic(c[2])}${pic(CONFIG.img[c[0]])}</div><h3>${c[1]}</h3></a>`).join('')}</div></div></section>
<section style="padding-top:20px"><div class="wrap"><div class="sh"><h2>Featured products</h2><a href="#/shop">View all</a></div><div class="grid">${PRODUCTS.filter(p=>p.tag).slice(0,8).map(card).join('')}</div></div></section>
${['ram','ssd','gpu','cpu','board','psu','case','periph'].map(rowOf).join('')}
<section id="cctv"><div class="wrap"><div class="cc"><div><h2>CCTV &amp; Security</h2><p>Cameras, DVR/NVR systems and security accessories, with installation enquiries handled on WhatsApp.</p><div class="art" style="border-radius:14px;margin-bottom:16px;aspect-ratio:16/9">${ic('cctv')}${pic(CONFIG.img.cctv)}</div><a class="btn g" href="#/shop?c=cam,nvr,sec">Browse CCTV Products</a></div>
<form class="f" id="cf" novalidate><h3>Installation enquiry</h3><label>Name<input name="name"><span class="err"></span></label><label>Location<input name="loc"><span class="err"></span></label><label>Property type<select name="type"><option value="">Select</option><option>Home</option><option>Office</option><option>Shop / Commercial</option></select><span class="err"></span></label><label>Number of cameras<input name="n" type="number" min="1" inputmode="numeric"><span class="err"></span></label><label>Requirements<textarea name="more" rows="2"></textarea></label><button class="btn w">Send on WhatsApp</button></form></div></div></section>
<section id="repair"><div class="wrap"><div class="sh"><h2>PC repair services</h2></div><div class="g5">${SERVICES.map(s=>`<div class="box"><span class="ico">${ic(s[2],30)}</span><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')}</div>
<div class="cc" style="margin-top:22px;border-color:var(--ln)"><div><h2 style="font-size:1.4rem">Repair enquiry</h2><div class="note">This is an enquiry, not a confirmed appointment or order.</div><div class="art" style="border-radius:14px;aspect-ratio:16/9">${ic('repair',60)}${pic(CONFIG.img.repair)}</div></div>
<form class="f" id="rf" novalidate><label>Name<input name="name"><span class="err"></span></label><label>Phone<input name="phone" type="tel"><span class="err"></span></label><label>Device type<select name="dev"><option value="">Select</option><option>Desktop</option><option>Laptop</option><option>Other</option></select><span class="err"></span></label><label>Problem<textarea name="desc" rows="3"></textarea><span class="err"></span></label><button class="btn w">Send repair enquiry on WhatsApp</button></form></div></div></section>
<section><div class="wrap"><div class="sh"><h2>Why choose us</h2></div><div class="g5">${WHY.map(w=>`<div class="box"><span class="ico">${ic(w[2],30)}</span><h3>${w[0]}</h3><p>${w[1]}</p></div>`).join('')}</div></div></section>`}

function shop(p){
 const sel=(p.get('c')||'').split(',').filter(Boolean),q=(p.get('q')||'').toLowerCase(),sort=p.get('o')||'';
 let l=PRODUCTS.filter(x=>(!sel.length||sel.includes(x.cat))&&(x.name+' '+cat(x.cat)[1]).toLowerCase().includes(q));
 if(sort==='az')l.sort((a,b)=>a.name.localeCompare(b.name));if(sort==='za')l.sort((a,b)=>b.name.localeCompare(a.name));
 const href=(c,o=sort)=>`#/shop?${new URLSearchParams({...(c?{c}:{}),...(q?{q}:{}),...(o?{o}:{})})}`;
 return `<div class="wrap" style="padding-top:22px;padding-bottom:30px"><div class="crumb" style="padding:0 0 10px"><a href="#/">Home</a> / Shop</div><h2>${q?`Results for "${esc(p.get('q'))}"`:'All products'}</h2>
<div class="chips"><a class="chip ${!sel.length?'on':''}" href="${href('')}">All</a>${CATS.map(c=>`<a class="chip ${sel.length===1&&sel[0]===c[0]?'on':''}" href="${href(c[0])}">${c[1]}</a>`).join('')}</div>
<div class="tb"><span style="color:var(--mu)">${l.length} product${l.length===1?'':'s'}</span><label style="margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--mu)">Sort<select id="so"><option value="">Featured</option><option value="az" ${sort==='az'?'selected':''}>Name A-Z</option><option value="za" ${sort==='za'?'selected':''}>Name Z-A</option></select></label></div>
${l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<p>No products match. <a href="#/shop" style="color:var(--gt)">Clear filters</a> or ask us on WhatsApp.</p>`}</div>`}

function product(id){
 const p=PRODUCTS[id];if(!p)return `<div class="wrap"><p style="padding:60px 0">Product not found. <a href="#/shop" style="color:var(--gt)">Back to shop</a></p></div>`;
 const rel=PRODUCTS.filter(x=>x.id!==p.id&&x.cat===p.cat).concat(PRODUCTS.filter(x=>x.cat!==p.cat)).slice(0,4);
 return `<div class="wrap"><div class="crumb"><a href="#/">Home</a> / <a href="#/shop?c=${p.cat}">${cat(p.cat)[1]}</a> / ${p.name}</div><div class="pd">${art(p)}<div><h1 style="font-size:2rem">${p.name}</h1><p>${cat(p.cat)[1]}</p><div class="pr" style="font-size:1.4rem;margin-bottom:12px">Price on Request</div><p>Specifications, brands and models vary. Message us for current details, price and availability. This is a demo listing; edit it in the PRODUCTS data.</p><div class="note">An enquiry is not a confirmed order. We will reply on WhatsApp.</div><a class="btn w" href="${wa(buy(p.name))}" target="_blank" rel="noopener" style="width:100%;padding:14px">Enquire on WhatsApp</a></div></div>
<div class="sh"><h2>Related products</h2></div><div class="grid">${rel.map(card).join('')}</div></div>`}

/* forms */
function valid(f,rules){let ok=true;f.querySelectorAll('.err').forEach(e=>e.textContent='');for(const [n,t,m] of rules){const el=f.elements[n];if(!t(el.value.trim())){el.closest('label').querySelector('.err').textContent=m;if(ok)el.focus();ok=false}}return ok}
const ne=m=>[v=>v.length>0,m];
function forms(){
 const c=$('#cf'),r=$('#rf');
 if(c)c.onsubmit=e=>{e.preventDefault();const x=c.elements;if(!valid(c,[['name',...ne('Enter your name.')],['loc',...ne('Enter your location.')],['type',...ne('Choose a property type.')],['n',v=>+v>=1,'Enter number of cameras.']]))return;go(`Hi, I am interested in CCTV installation. Please contact me to discuss my requirements and quotation.\nName: ${x.name.value.trim()}\nLocation: ${x.loc.value.trim()}\nProperty type: ${x.type.value}\nCameras: ${x.n.value}\nRequirements: ${x.more.value.trim()||'None'}`)};
 if(r)r.onsubmit=e=>{e.preventDefault();const x=r.elements;if(!valid(r,[['name',...ne('Enter your name.')],['phone',v=>/^[+\d][\d\s-]{6,}$/.test(v),'Enter a valid phone number.'],['dev',...ne('Choose a device type.')],['desc',v=>v.length>=10,'Describe the problem briefly.']]))return;go(`Hi, I need PC/laptop repair assistance. My device is ${x.dev.value}. Please let me know the next steps.\nName: ${x.name.value.trim()}\nPhone: ${x.phone.value.trim()}\nProblem: ${x.desc.value.trim()}\n(Repair enquiry, not a confirmed appointment)`)};
}

/* router */
function route(){
 const h=location.hash.slice(1)||'/',[path,qs]=h.split('?'),p=new URLSearchParams(qs||''),m=path.match(/^\/product\/(\d+)/);
 $('#app').innerHTML=m?product(+m[1]):path==='/shop'?shop(p):home();
 document.title=(m&&PRODUCTS[+m[1]]?PRODUCTS[+m[1]].name+' | ':'')+'TechFix Solutions';
 document.querySelectorAll('[data-wa]').forEach(a=>{a.href=wa(a.dataset.wa);a.target='_blank';a.rel='noopener'});
 forms();
 const so=$('#so');if(so)so.onchange=()=>{p.set('o',so.value);location.hash='/shop?'+p};
 $('#cn').classList.remove('open');$('#bg').setAttribute('aria-expanded',false);
 const s=p.get('s'),t=s&&$('#'+s);
 if(t)t.scrollIntoView();else window.scrollTo(0,0);
}
$('#sf').onsubmit=e=>{e.preventDefault();const q=$('#sq').value.trim();location.hash='/shop'+(q?'?q='+encodeURIComponent(q):'')};
$('#bg').onclick=()=>{const o=$('#cn').classList.toggle('open');$('#bg').setAttribute('aria-expanded',o)};
addEventListener('hashchange',route);route();
</script>
</body>
</html>
